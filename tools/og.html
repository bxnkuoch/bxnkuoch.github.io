<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#09090d;color:#ececf1;font-family:"Space Grotesk",sans-serif;position:relative}
.bg{position:absolute;inset:0;background:
 radial-gradient(520px 320px at 18% 35%,rgba(139,139,255,.28),transparent 70%),
 radial-gradient(480px 300px at 92% 8%,rgba(61,214,230,.18),transparent 70%),
 linear-gradient(#23232f 1px,transparent 1px) 0 0/56px 56px,
 linear-gradient(90deg,#23232f 1px,transparent 1px) 0 0/56px 56px;
 -webkit-mask-image:radial-gradient(ellipse 90% 85% at 40% 40%,#000 35%,transparent 80%)}
.wrap{position:relative;padding:72px 80px;height:100%;box-sizing:border-box;display:flex;flex-direction:column}
.id{display:flex;align-items:center;gap:20px}
.mono{font-family:"JetBrains Mono",monospace;font-size:22px;color:#9799a8}
.mark{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,#8b8bff,#3dd6e6);display:grid;place-items:center;font-weight:700;font-size:26px;color:#fff}
.name{font-size:30px;font-weight:600}
h1{font-size:68px;line-height:1.04;letter-spacing:-.035em;margin:48px 0 0;max-width:20ch;
 background:linear-gradient(180deg,#ececf1 45%,rgba(236,236,241,.5));-webkit-background-clip:text;color:transparent}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center}
.tags{display:flex;gap:12px}
.tags span{font-family:"JetBrains Mono",monospace;font-size:20px;padding:8px 16px;border:1px solid #2e2e3c;border-radius:10px;background:#111118;color:#c9cad6}
.url{font-family:"JetBrains Mono",monospace;font-size:22px;color:#8b8bff}
</style></head><body><div class="bg"></div><div class="wrap">
<div class="id"><div class="mark">BK</div><div><div class="name">Benjamin Kuoch</div><div class="mono">CS @ Drexel University</div></div></div>
<h1>I build AI-powered tools, from research ideas to working products.</h1>
<div class="foot"><div class="tags"><span>ML</span><span>Multi-agent</span><span>Hackathons</span></div><div class="url">bxnkuoch.github.io</div></div>
</div></body></html>
